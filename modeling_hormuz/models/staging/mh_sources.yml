version: 2

sources:
  - name: mh_sources
    description: "This is the source for the Hormuz project"
    schema: raw
    tables:
      - name: brent_crude_usd
        description: "Daily Historic Data of Brent Crude in USD"
        database: "{{ env_var('DB_NAME') }}"
        schema: raw
        columns:
          - name: period
            description: "The date of the price observation."
            tests:
              - not_null
              - unique
          - name: value
            description: "The price of Brent Crude in USD on the given date."
            tests:
              - not_null
      - name: wti_usd
        description: "Daily Historical Data of WTI Crude in USD"
        database: "{{ env_var('DB_NAME') }}"
        schema: raw
        columns:
          - name: period
            description: "The date of the price observation."
            tests:
              - not_null
              - unique
          - name: value
            description: "The price of WTI in USD on the given date."
            tests:
              - not_null
      - name: gasoline
        description: "Weekly Pricing of Gasoline Across U.S."
        database: "{{ env_var('DB_NAME') }}"
        schema: raw
        columns:
          - name: period
            description: "The date of the price observation."
            tests:
              - not_null
              - unique
          - name: value
            description: "The price of WTI in USD on the given date."
            tests:
              - not_null