models:
  - name: ba_mh_wti
    description: "Business Analytics model for WTI crude oil data"
    columns:
      - name: wti_id
        tests:
          - not_null
          - unique
      - name: product_type
        tests:
          - not_null
          - valid_values:
              values: ['WTI Crude Oil']
  - name: ba_mh_brent
    description: "Business Analytics model for Brent crude oil data"
    columns:
      - name: brent_id
        tests:
          - not_null
          - unique
      - name: product_type
        tests:
          - not_null
          - valid_values:
              values: ['UK Brent Crude Oil']
  - name: ba_mh_gasoline
    description: "Business Analytics model for Gasoline data"
    columns:
      - name: gas_id
        tests:
          - not_null
          - unique
      - name: product_type
        tests:
          - not_null
          - valid_values:
              values: ['Total Gasoline']
  - name: brent_crude_diff
    description: "Difference between Brent Crude and WTI Crude Pricing"
    columns:
      - name: brent_wti_diff
        tests:
          - not null